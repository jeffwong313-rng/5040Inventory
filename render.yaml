services:
  - type: web
    name: warehouse-inventory-dashboard
    runtime: docker
    plan: free
    envVars:
      - key: SHEET_ID
        value: 1eSonYt5Fyxyune85dnnntaunvOupIzBN6eMEhFrHnU8
      - key: GID_TIMELINE
        value: "289573693"
      - key: GID_COUNT_TEAMS
        value: "208058828"
      - key: GID_ALL_BINS
        value: "91380376"
      - key: GID_WHATS_LEFT
        value: "1571653131"
      - key: GID_LOOKUP
        value: "80916219"
      # Secret part of the private manager link (/m/<value>). Render asks
      # for it on first sync; change it under Environment to revoke.
      - key: MANAGER_PASSWORD
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "20"
