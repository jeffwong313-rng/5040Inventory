name: Refresh companion map

# Rebuilds docs/data/map.json (the picture of the warehouse used by the
# companion site) from the map tabs of the inventory Google Sheet.
# Runs daily (about 5:15 AM and 9:20 AM Pacific), whenever the extractor or
# this file changes, and on demand from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"
    # 9:20 AM PDT, so the map is fresh before the 10 AM start
    # (GitHub often starts scheduled runs 5-20 minutes late)
    - cron: "20 16 * * *"
  push:
    branches: [main]
    paths:
      - "tools/extract_map.mjs"
      - ".github/workflows/companion-map.yml"

permissions:
  contents: write

concurrency:
  group: companion-map
  cancel-in-progress: true

jobs:
  build-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Read the map tabs
        run: node tools/extract_map.mjs docs/data/map.json

      - name: Commit if the map changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/map.json
          if git diff --cached --quiet; then
            echo "Map unchanged"
          else
            # [skip render] keeps Render from redeploying the dashboard for a map-only change
            git commit -m "Refresh companion map from sheet [skip render]"
            git push
          fi
